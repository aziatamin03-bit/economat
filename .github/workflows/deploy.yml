
name: Build and Deploy OBAYOLI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and regression tests
        run: npm run lint && npm test

      - name: Build project
        run: npm run build

      - name: Diagnose Wrangler configuration
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Wrangler config files ==="
          find . -maxdepth 3 \( -name "wrangler.jsonc" -o -name "wrangler.json" -o -name "wrangler.toml" \) -not -path "./node_modules/*" -print
          echo "=== Generated Wrangler redirect ==="
          if [ -f .wrangler/deploy/config.json ]; then
            cat .wrangler/deploy/config.json
          else
            echo "No generated Wrangler redirect found"
          fi
          echo "=== Validate Wrangler configuration ==="
          npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
